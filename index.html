:root{--dark:#422f43;--white:#ffffff;--pink:#ffeeee;--lav:#8f7e90;--tg-top:0px;--tg-bottom:0px;--tg-left:0px;--tg-right:0px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pink);color:var(--dark);font:400 17px/1.6 "Orchidea","Orchidea Pro",Georgia,"Times New Roman",serif;font-synthesis:none;overflow-wrap:anywhere}
h1,h2,h3,legend,.display{font-family:"Orchidea","Orchidea Pro",Georgia,"Times New Roman",serif;font-weight:600;line-height:1.2;margin:0}
.wrap{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
 padding:calc(max(env(safe-area-inset-top,0px),var(--tg-top)) + 20px) calc(max(env(safe-area-inset-right,0px),var(--tg-right)) + 20px) calc(max(env(safe-area-inset-bottom,0px),var(--tg-bottom)) + 24px) calc(max(env(safe-area-inset-left,0px),var(--tg-left)) + 20px)}
main{flex:1;display:flex;flex-direction:column;gap:20px}
.card{background:var(--white);border-radius:24px;padding:24px 20px;box-shadow:0 6px 24px rgba(66,47,67,.08)}
.eyebrow{font-size:16px;letter-spacing:.04em;margin:0}
.title{font-size:clamp(28px,8vw,40px);text-transform:uppercase;letter-spacing:.02em}
.small{font-size:16px;margin:0}
p{margin:0 0 14px}p:last-child{margin-bottom:0}
[tabindex="-1"]:focus{outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 26px;border-radius:999px;border:2px solid var(--dark);background:transparent;color:var(--dark);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;text-align:center}
.btn.primary{background:var(--dark);color:var(--white)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.opt:focus-within,a:focus-visible{outline:3px solid var(--dark);outline-offset:3px;box-shadow:0 0 0 3px var(--white)}
.nav{display:flex;gap:12px;margin-top:4px}.nav .btn{flex:1}
.bar{height:10px;border-radius:99px;background:var(--white);border:1px solid var(--lav);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--dark);width:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:clamp(21px,5.6vw,27px);padding:0;margin-bottom:12px}
.hint{font-size:16px;margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;min-height:56px;padding:16px;border-radius:18px;background:var(--white);border:2px solid var(--lav);cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.mark{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;margin-top:1px;font-size:15px;line-height:1}
.opt.sel{background:var(--dark);color:var(--white);border-color:var(--dark)}
.opt.sel .mark::after{content:"✓"}

function calculate(answers, cfg) {

  }

    var d = b.sum * a.count - a.sum * b.count;
    return d !== 0 ? d : cfg.tiePriority.indexOf(a.key) - cfg.tiePriority.indexOf(b.key);
  });

function openLink(url, ev) {
  var w = tg();
  if (!inTelegram() || !w) return; // обычная ссылка сработает сама
  var isTme = false; try { var h = new URL(url).hostname; isTme = h === "t.me" || h === "telegram.me"; } catch (e) {}
  var fn = isTme && typeof w.openTelegramLink === "function" ? "openTelegramLink" : (typeof w.openLink === "function" ? "openLink" : null);
  if (!fn) return;
  ev.preventDefault();
  try { w[fn](url); } catch (e) { try { window.open(url, "_blank", "noopener,noreferrer"); } catch (e2) { location.href = url; } }
}
function giftLinks() {
  var L = C.links, G = C.gift, out = [];
  if (validHttps(L.giftUrl)) return [{ url: L.giftUrl, label: G.giftButton }];
  if (validHttps(L.guideUrl)) out.push({ url: L.guideUrl, label: G.guideButton });
  if (validHttps(L.workbookUrl)) out.push({ url: L.workbookUrl, label: G.workbookButton });
  return out;
}

// ===== Telegram SDK (необязателен) =====
function call(o, m, a) { try { if (o && typeof o[m] === "function") o[m].apply(o, a || []); } catch (e) {} }
function initTelegram() {
  var w = tg(); if (!w) return;
  call(w, "ready"); call(w, "expand");
  call(w, "setHeaderColor", [C.palette.pink]); call(w, "setBackgroundColor", [C.palette.pink]); call(w, "setBottomBarColor", [C.palette.pink]);
  var apply = function () {
    var s = w.safeAreaInset || {}, c = w.contentSafeAreaInset || {}, r = document.documentElement.style;
    ["top", "bottom", "left", "right"].forEach(function (k) { r.setProperty("--tg-" + k, ((s[k] || 0) + (c[k] || 0)) + "px"); });
  };
  apply();
  ["safeAreaChanged", "contentSafeAreaChanged"].forEach(function (e) { call(w, "onEvent", [e, apply]); });
}

// ===== Отрисовка =====
var root = $("#app");
function show(html) {
  root.innerHTML = html;
  window.scrollTo(0, 0);
  var f = $("[data-focus]", root); if (f) f.focus({ preventScroll: true });
}
function progressHtml() {
  var n = answeredCount(), t = C.questions.length, txt = fmt(C.ui.progressLabel, { n: n, total: t });
  return '<div class="bar" role="progressbar" aria-label="' + esc(txt) + '" aria-valuemin="0" aria-valuemax="' + t + '" aria-valuenow="' + n + '" aria-valuetext="' + esc(txt) + '"><i style="width:' + (n / t * 100) + '%"></i></div>';
}
function renderWelcome() {
  state.screen = "welcome"; var W = C.welcome;
  show('<section class="card" aria-labelledby="t"><p class="eyebrow">' + esc(W.eyebrow) + '</p><h1 class="title" id="t" tabindex="-1" data-focus style="margin:14px 0 18px">' + esc(W.title) + '</h1>' + paras(W.text) +
    '<p style="margin-top:22px"><button type="button" class="btn primary" data-act="start">' + esc(W.button) + '</button></p><p class="small">' + esc(W.note) + '</p></section>');
}
function renderQuestion() {
  state.screen = "quiz"; var q = C.questions[state.index], total = C.questions.length, last = state.index === total - 1;
  var opts = q.options.map(function (o) {
    var id = "q" + q.id + "-" + o[1], sel = state.answers[q.id] === o[1];
    return '<label class="opt' + (sel ? " sel" : "") + '" for="' + id + '"><input type="radio" id="' + id + '" name="q' + q.id + '" value="' + o[1] + '"' + (sel ? " checked" : "") + '><span class="mark" aria-hidden="true"></span><span>' + esc(o[0]) + '</span></label>';
  }).join("");
  show('<section aria-labelledby="qn">' + progressHtml() +
    '<h2 id="qn" class="small" style="font-family:inherit;font-weight:600;margin:18px 0 10px" tabindex="-1" data-focus>' + esc(fmt(C.ui.question, { n: state.index + 1, total: total })) + '</h2>' +
    '<fieldset' + (q.hint ? ' aria-describedby="hint"' : "") + '><legend>' + esc(q.text) + '</legend>' + (q.hint ? '<p class="hint" id="hint">' + esc(q.hint) + '</p>' : "") +
    '<div class="opts">' + opts + '</div></fieldset>' +
    '<div class="nav" style="margin-top:20px"><button type="button" class="btn" data-act="back">' + esc(C.ui.back) + '</button><button type="button" class="btn primary" id="next" data-act="next"' + (hasAnswer(q.id) ? "" : " disabled") + '>' + esc(last ? C.ui.showResult : C.ui.next) + '</button></div></section>');
}
function renderResult() {
  var r = calculate(state.answers, C);
  if (!r) { state.index = Math.max(0, C.questions.findIndex(function (q) { return !hasAnswer(q.id); })); return renderQuestion(); }
  state.screen = "result"; var R = C.results[r.main], U = C.ui, G = C.gift;
  var dirs = C.directions.map(function (d, i) { var lv = r.stats[i].level;
    return '<li><b>' + esc(d.name) + '</b><span class="st"><span class="dot l' + lv + '" aria-hidden="true"></span>' + esc(C.statusLabels[lv]) + '</span></li>'; }).join("");
  var links = giftLinks().map(function (l, i) {
    return '<a class="btn ' + (i === 0 ? "primary" : "") + '" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer" data-link>' + esc(l.label) + '</a>'; }).join("");
  show('<article class="card" aria-labelledby="rt"><p class="eyebrow">' + esc(U.resultEyebrow) + '</p><h1 class="res-title" id="rt" tabindex="-1" data-focus>' + esc(R.title) + '</h1>' + paras(R.text) +
    (r.second ? '<p>' + esc(C.extras[r.second]) + '</p>' : "") + '</article>' +
    '<section class="card step" aria-labelledby="st"><h2 id="st" style="font-size:22px;text-transform:uppercase;margin-bottom:10px">' + esc(U.firstStep) + '</h2><p>' + esc(R.step) + '</p></section>' +
    '<section class="card" aria-labelledby="ds"><h2 id="ds" style="font-size:22px;text-transform:uppercase">' + esc(U.dirsTitle) + '</h2><ul class="dirs">' + dirs + '</ul><p class="small" style="margin-top:16px">' + esc(U.resultNote) + '</p></section>' +
    '<section class="card" aria-labelledby="gf"><h2 id="gf" style="font-size:22px;text-transform:uppercase;margin-bottom:12px">' + esc(G.title) + '</h2>' + paras(G.text) + '<p class="sign">' + esc(G.signature) + '</p>' + (links ? '<div class="gift">' + links + '</div>' : "") + '</section>' +
    '<div class="actions"><button type="button" class="btn" data-act="edit">' + esc(U.edit) + '</button><button type="button" class="btn" id="restart" data-act="restart">' + esc(U.restart) + '</button></div>');
}

// ===== События =====
root.addEventListener("change", function (e) {
  var t = e.target; if (!t || t.type !== "radio") return;
  var q = C.questions[state.index]; state.answers[q.id] = Number(t.value);
  root.querySelectorAll(".opt").forEach(function (l) { var i = l.querySelector("input"); l.classList.toggle("sel", i.checked); });
  var n = $("#next"); if (n) n.disabled = false;
  var bar = $(".bar"); if (bar) { var c = answeredCount(), tt = C.questions.length, txt = fmt(C.ui.progressLabel, { n: c, total: tt });
    bar.setAttribute("aria-valuenow", c); bar.setAttribute("aria-valuetext", txt); bar.setAttribute("aria-label", txt); bar.firstChild.style.width = (c / tt * 100) + "%"; }
});
root.addEventListener("click", function (e) {
  var a = e.target.closest("a[data-link]"); if (a) { openLink(a.href, e); return; }
  var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  var act = b.getAttribute("data-act"), last = C.questions.length - 1;
  if (act === "start") { state.index = 0; renderQuestion(); }
  else if (act === "back") { if (state.index === 0) renderWelcome(); else { state.index--; renderQuestion(); } }
  else if (act === "next") { if (!hasAnswer(C.questions[state.index].id)) return; if (state.index < last) { state.index++; renderQuestion(); } else renderResult(); }
  else if (act === "edit") { state.index = 0; renderQuestion(); }
  else if (act === "restart") openDialog();
});

// ===== Окно подтверждения =====
var ov = $("#ov"), yes = $("#dlgYes"), no = $("#dlgNo"), lastFocus = null;
$("#dlgT").textContent = C.ui.confirmText; yes.textContent = C.ui.confirm; no.textContent = C.ui.cancel;
function openDialog() { lastFocus = document.activeElement; ov.hidden = false; no.focus(); }
function closeDialog() { ov.hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
no.addEventListener("click", closeDialog);
yes.addEventListener("click", function () { ov.hidden = true; lastFocus = null; state = { screen: "welcome", index: 0, answers: {} }; renderWelcome(); });
ov.addEventListener("click", function (e) { if (e.target === ov) closeDialog(); });
document.addEventListener("keydown", function (e) {
  if (ov.hidden) return;
  if (e.key === "Escape") { e.preventDefault(); closeDialog(); }
  else if (e.key === "Tab") { var f = [no, yes], i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + 2) % 2].focus(); }
});

// ===== Запуск =====
document.title = C.title;
renderWelcome();
initTelegram();
window.addEventListener("load", initTelegram);
})();
</script>
</body>
</html>
